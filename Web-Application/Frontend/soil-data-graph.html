<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SPoHF Soil Measurements</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-[#020617] text-white font-sans m-0 p-0 h-screen w-screen">
    <div class="flex flex-col h-screen w-screen">
      <!-- Top bar -->
      <div class="flex items-center justify-between px-4 py-2 gap-4">
        <h2 class="font-medium text-xl">
          SPoHF Soil Data Graph, Company: Vitarom Gbr
        </h2>

        <div class="flex items-center gap-2">
          <!-- Location picker -->
          <label for="locationSelect" class="text-sm text-gray-300"
            >Location</label
          >
          <select
            id="locationSelect"
            class="bg-slate-800 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500"
          >
            <option>Loading…</option>
          </select>

          <!-- Limit picker -->
          <label for="limitSelect" class="text-sm text-gray-300"
            >Data Nodes</label
          >
          <select
            id="limitSelect"
            class="bg-slate-800 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500"
            title="How many latest measurements to load"
          >
            <!-- default = 25 -->
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>

          <!-- Refresh -->
          <button
            id="refreshBtn"
            class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-3 py-2 rounded-md"
            title="Reload data now"
          >
            Refresh
          </button>
        </div>
      </div>

      <div class="px-4 -mt-2 text-xs text-slate-400">
        Backend: <span id="backendLabel" class="font-mono"></span>
        <span id="status" class="ml-3"></span>
      </div>

      <div class="flex-1 p-4">
        <canvas id="chart" class="w-full h-full"></canvas>
      </div>
    </div>

    <script>
      // === Configure your backend URL here ===
      const API_BASE = "https://spohf-yolo-v11-production.up.railway.app";
      // Optional: auto-refresh (ms). Set to 0 to disable.
      const AUTO_REFRESH_MS = 900_000; // 60s
      document.getElementById("backendLabel").textContent = API_BASE;

      // --- Helpers ---
      async function getJSON(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`${res.status} ${res.statusText}: ${text || url}`);
        }
        return res.json();
      }
      function toJsNumber(value) {
        if (value === null || value === undefined) return NaN;
        const n = Number(value);
        return Number.isNaN(n) ? NaN : n;
      }
      function setStatus(msg, isError = false) {
        const el = document.getElementById("status");
        el.textContent = msg || "";
        el.className = isError ? "text-red-400" : "text-slate-400";
      }

      // Normalize timestamps
      function normalizeTimestamp(ts) {
        if (!ts) return "";
        if (typeof ts === "string") return ts;
        if (ts instanceof Date) return ts.toISOString();
        if (typeof ts === "object" && "seconds" in ts) {
          return new Date(ts.seconds * 1000).toISOString();
        }
        return String(ts);
      }

      // --- Data loading from backend ---
      async function loadLocations() {
        setStatus("Loading locations…");
        const locations = await getJSON(`${API_BASE}/locations`);
        const select = document.getElementById("locationSelect");
        select.innerHTML = "";
        locations.forEach((name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
        setStatus(`Loaded ${locations.length} location(s).`);
        return locations;
      }

      // Load soil measurements
      async function loadSoilMeasurements(locationName, limit) {
        setStatus(`Loading soil measurements for ${locationName}…`);
        const url = `${API_BASE}/soil-measurements?location=${encodeURIComponent(
          locationName,
        )}${limit ? `&limit=${encodeURIComponent(limit)}` : ""}`;

        let rows = await getJSON(url);

        // Fallback (client-side): keep the most recent N rows
        if (
          Array.isArray(rows) &&
          Number.isFinite(limit) &&
          rows.length > limit
        ) {
          rows = rows.slice(-limit);
        }

        setStatus(`Loaded ${rows.length} soil points for ${locationName}.`);
        return rows;
      }

      // --- Chart ---
      let chart = null;
      function drawChart(rows) {
        const labels = rows.map((r) => normalizeTimestamp(r.timestamp));
        const data = {
          soil_temp_0cm: rows.map((r) => toJsNumber(r.soil_temp_0cm)),
          soil_temp_6cm: rows.map((r) => toJsNumber(r.soil_temp_6cm)),
          soil_temp_18cm: rows.map((r) => toJsNumber(r.soil_temp_18cm)),
          soil_moisture_0_1cm: rows.map((r) =>
            toJsNumber(r.soil_moisture_0_1cm),
          ),
          soil_moisture_1_3cm: rows.map((r) =>
            toJsNumber(r.soil_moisture_1_3cm),
          ),
          soil_moisture_3_9cm: rows.map((r) =>
            toJsNumber(r.soil_moisture_3_9cm),
          ),
        };

        const colors = {
          soil_temp_0cm: "rgb(239, 68, 68)",
          soil_temp_6cm: "rgb(245, 158, 11)",
          soil_temp_18cm: "rgb(34, 197, 94)",
          soil_moisture_0_1cm: "rgb(59, 130, 246)",
          soil_moisture_1_3cm: "rgb(168, 85, 247)",
          soil_moisture_3_9cm: "rgb(139, 92, 246)",
        };

        const datasets = Object.keys(data).map((key) => ({
          label: key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, " "),
          data: data[key],
          borderColor: colors[key],
          tension: 0.25,
          pointRadius: 0,
          spanGaps: true,
          yAxisID: key,
        }));

        const scales = {};
        Object.keys(data).forEach((key) => {
          const isTemperature = key.includes("temp");
          scales[key] = {
            type: "linear",
            position: isTemperature ? "left" : "right",
            ticks: { color: "#9ca3af" },
            title: {
              display: true,
              text:
                key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, " "),
              color: "#e5e7eb",
            },
            grid: {
              drawOnChartArea: key === "soil_temp_0cm",
              color: "rgba(255,255,255,0.08)",
            },
          };
          if (key.includes("moisture")) {
            scales[key].min = 0;
            scales[key].max = 100;
          }
        });

        const el = document.getElementById("chart");
        if (chart) chart.destroy();
        chart = new Chart(el, {
          type: "line",
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { labels: { color: "#e5e7eb" } },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const v = ctx.parsed.y;
                    if (v === null || Number.isNaN(v))
                      return `${ctx.dataset.label}: —`;
                    return `${ctx.dataset.label}: ${v}`;
                  },
                },
              },
            },
            scales,
          },
        });
      }

      // --- Orchestration ---
      async function reloadAll() {
        try {
          const locationSelect = document.getElementById("locationSelect");
          const limitSelect = document.getElementById("limitSelect");
          const locationName = locationSelect.value;
          const limit = Number(limitSelect.value) || 25;
          if (!locationName) return;
          const rows = await loadSoilMeasurements(locationName, limit);
          drawChart(rows);
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Failed to load", true);
        }
      }

      async function init() {
        try {
          const locations = await loadLocations();
          const locationSelect = document.getElementById("locationSelect");
          const limitSelect = document.getElementById("limitSelect");

          locationSelect.addEventListener("change", reloadAll);
          limitSelect.addEventListener("change", reloadAll);
          document
            .getElementById("refreshBtn")
            .addEventListener("click", reloadAll);

          if (locations.length) {
            await reloadAll();
          }
          if (AUTO_REFRESH_MS > 0) {
            setInterval(reloadAll, AUTO_REFRESH_MS);
          }
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Failed to initialize", true);
        }
      }

      init();
    </script>
  </body>
</html>
