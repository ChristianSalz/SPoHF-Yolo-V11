<! doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insect Detection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-900 text-white min-h-screen p-8 flex flex-col">
    <div class="max-w-4xl mx-auto flex-1">
      <h1 class="text-3xl font-bold mb-8">Insect Detection API Test</h1>

      <div class="bg-slate-800 rounded-lg p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">Upload Image</h2>
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer"
        />
        <button
          id="predictBtn"
          class="mt-4 bg-green-600 hover:bg-green-700 px-6 py-2 rounded-lg font-semibold"
        >
          Detect Insects
        </button>
      </div>

      <div id="loading" class="hidden bg-slate-800 rounded-lg p-6 mb-6">
        <p class="text-center">Processing... This may take a moment.</p>
      </div>

      <div id="results" class="hidden bg-slate-800 rounded-lg p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4">Results</h2>
        <p class="text-2xl mb-4">
          Insects Detected:
          <span id="insectCount" class="text-green-400 font-bold">0</span>
        </p>
      </div>

      <div id="imageContainer" class="hidden">
        <h2 class="text-xl font-semibold mb-4">Annotated Image</h2>
        <img
          id="annotatedImage"
          class="w-full rounded-lg border border-slate-700"
        />
      </div>

      <div id="errorContainer" class="hidden bg-red-900 rounded-lg p-6 mb-6">
        <h2 class="text-xl font-semibold mb-4 text-red-300">Error</h2>
        <p id="errorMessage" class="text-red-200"></p>
      </div>
    </div>

    <footer
      class="mt-12 pt-8 border-t border-slate-700 text-center text-sm text-slate-400"
    >
      <p>
        Developed by Mr. Salz in consultation with Mr. Tange @ Fontys Venlo
        Informatica with ❤️
      </p>
    </footer>

    <script>
      const API_URL =
        "https://ai-service-production-5a39.up.railway.app/predict";

      document
        .getElementById("predictBtn")
        .addEventListener("click", async () => {
          const fileInput = document.getElementById("imageInput");
          const file = fileInput.files[0];

          if (!file) {
            alert("Please select an image first! ");
            return;
          }

          document.getElementById("loading").classList.remove("hidden");
          document.getElementById("results").classList.add("hidden");
          document.getElementById("imageContainer").classList.add("hidden");
          document.getElementById("errorContainer").classList.add("hidden");

          const formData = new FormData();
          formData.append("image", file);
          formData.append("return_image", "true");
          formData.append("conf", "0.40");
          formData.append("iou", "0.20");

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              body: formData,
              signal: AbortSignal.timeout(60000),
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`HTTP ${response.status}: ${errorText}`);
            }

            const data = await response.json();

            document.getElementById("loading").classList.add("hidden");

            document.getElementById("results").classList.remove("hidden");
            document.getElementById("insectCount").textContent =
              data.num_insects;

            if (data.annotated_image) {
              document
                .getElementById("imageContainer")
                .classList.remove("hidden");
              document.getElementById("annotatedImage").src =
                "data:image/jpeg;base64," + data.annotated_image;
            }
          } catch (error) {
            document.getElementById("loading").classList.add("hidden");
            document
              .getElementById("errorContainer")
              .classList.remove("hidden");
            document.getElementById("errorMessage").textContent = error.message;
          }
        });
    </script>
  </body>
</html>
