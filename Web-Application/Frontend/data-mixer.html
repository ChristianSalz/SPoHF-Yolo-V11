<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SPoHF Data Mixer</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-[#020617] text-white font-sans m-0 p-0 h-screen w-screen">
    <div class="flex flex-col h-screen w-screen">
      <!-- Top bar -->
      <div class="flex items-center justify-between px-4 py-2 gap-4">
        <h2 class="font-medium text-xl">
          SPoHF Data Mixer, Company: Vitarom Gbr
        </h2>

        <div class="flex items-center gap-2">
          <!-- Location picker -->
          <label for="locationSelect" class="text-sm text-gray-300"
            >Location</label
          >
          <select
            id="locationSelect"
            class="bg-slate-800 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500"
          >
            <option>Loading…</option>
          </select>

          <!-- Limit picker -->
          <label for="limitSelect" class="text-sm text-gray-300"
            >Data Nodes</label
          >
          <select
            id="limitSelect"
            class="bg-slate-800 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500"
          >
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>

          <!-- Refresh -->
          <button
            id="refreshBtn"
            class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-3 py-2 rounded-md"
          >
            Refresh
          </button>
        </div>
      </div>

      <div class="px-4 -mt-2 text-xs text-slate-400">
        Backend: <span id="backendLabel" class="font-mono"></span>
        <span id="status" class="ml-3"></span>
      </div>

      <!-- Main content with sidebar -->
      <div class="flex flex-1 gap-4 p-4">
        <!-- Left sidebar: toggles -->
        <div class="w-64 bg-slate-800 rounded-lg p-4 overflow-y-auto border border-slate-700">
          <h3 class="font-semibold text-lg mb-4 text-blue-400">Data Sources</h3>

          <!-- WEATHER -->
          <div class="mb-6">
            <h4 class="text-sm font-bold text-slate-300 mb-2 uppercase">Weather</h4>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_temperature" class="w-4 h-4" />
              <span class="text-sm">Temperature (°C)</span>
            </label>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_humidity" class="w-4 h-4" />
              <span class="text-sm">Humidity (%)</span>
            </label>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_pressure" class="w-4 h-4" />
              <span class="text-sm">Pressure (hPa)</span>
            </label>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_precipitation" class="w-4 h-4" />
              <span class="text-sm">Precipitation (mm)</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_wind_speed" class="w-4 h-4" />
              <span class="text-sm">Wind Speed (m/s)</span>
            </label>
          </div>

          <!-- SOLAR -->
          <div class="mb-6 border-t border-slate-600 pt-4">
            <h4 class="text-sm font-bold text-slate-300 mb-2 uppercase">Solar</h4>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_uv_index" class="w-4 h-4" />
              <span class="text-sm">UV Index</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_direct_radiation" class="w-4 h-4" />
              <span class="text-sm">Direct Radiation (W/m²)</span>
            </label>
          </div>

          <!-- SOIL -->
          <div class="border-t border-slate-600 pt-4">
            <h4 class="text-sm font-bold text-slate-300 mb-2 uppercase">Soil</h4>
            <div class="text-xs text-slate-400 mb-2">Temperature</div>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_soil_temp_0cm" class="w-4 h-4" />
              <span class="text-sm">0 cm</span>
            </label>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_soil_temp_6cm" class="w-4 h-4" />
              <span class="text-sm">6 cm</span>
            </label>
            <label class="flex items-center gap-2 mb-4 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_soil_temp_18cm" class="w-4 h-4" />
              <span class="text-sm">18 cm</span>
            </label>

            <div class="text-xs text-slate-400 mb-2">Moisture</div>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_soil_moisture_0_1cm" class="w-4 h-4" />
              <span class="text-sm">0-1 cm</span>
            </label>
            <label class="flex items-center gap-2 mb-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_soil_moisture_1_3cm" class="w-4 h-4" />
              <span class="text-sm">1-3 cm</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer hover:text-blue-400">
              <input type="checkbox" id="check_soil_moisture_3_9cm" class="w-4 h-4" />
              <span class="text-sm">3-9 cm</span>
            </label>
          </div>
        </div>

        <!-- Right: Chart -->
        <div class="flex-1">
          <canvas id="chart" class="w-full h-full"></canvas>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = "https://spohf-yolo-v11-production.up.railway.app";
      const AUTO_REFRESH_MS = 60_000;
      document.getElementById("backendLabel").textContent = API_BASE;

      // --- Helpers ---
      async function getJSON(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`${res.status} ${res.statusText}: ${text || url}`);
        }
        return res.json();
      }

      function toJsNumber(value) {
        if (value === null || value === undefined) return NaN;
        const n = Number(value);
        return Number.isNaN(n) ? NaN : n;
      }

      function setStatus(msg, isError = false) {
        const el = document.getElementById("status");
        el.textContent = msg || "";
        el.className = isError ? "text-red-400" : "text-slate-400";
      }

      function normalizeTimestamp(ts) {
        if (!ts) return "";
        if (typeof ts === "string") return ts;
        if (ts instanceof Date) return ts.toISOString();
        if (typeof ts === "object" && "seconds" in ts) {
          return new Date(ts.seconds * 1000).toISOString();
        }
        return String(ts);
      }

      // --- Data loading ---
      async function loadLocations() {
        setStatus("Loading locations…");
        const locations = await getJSON(`${API_BASE}/locations`);
        const select = document.getElementById("locationSelect");
        select.innerHTML = "";
        locations.forEach((name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
        setStatus(`Loaded ${locations.length} location(s).`);
        return locations;
      }

      async function loadAllMeasurements(locationName, limit) {
        setStatus(`Loading all measurements for ${locationName}…`);
        const promises = [
          getJSON(`${API_BASE}/measurements?location=${encodeURIComponent(locationName)}&limit=${limit}`),
          getJSON(`${API_BASE}/solar-measurements?location=${encodeURIComponent(locationName)}&limit=${limit}`),
          getJSON(`${API_BASE}/soil-measurements?location=${encodeURIComponent(locationName)}&limit=${limit}`),
        ];

        const [weather, solar, soil] = await Promise.all(promises);

        // Merge by timestamp
        const merged = {};
        weather.forEach((w) => {
          merged[w.timestamp] = { ...merged[w.timestamp], ...w };
        });
        solar.forEach((s) => {
          merged[s.timestamp] = { ...merged[s.timestamp], ...s };
        });
        soil.forEach((s) => {
          merged[s.timestamp] = { ...merged[s.timestamp], ...s };
        });

        const result = Object.values(merged).sort(
          (a, b) => new Date(a.timestamp) - new Date(b.timestamp)
        );

        setStatus(`Loaded ${result.length} combined data points.`);
        return result;
      }

      // --- Chart config ---
      const dataConfig = {
        temperature: { label: "Temperature (°C)", color: "rgb(239, 68, 68)", yAxis: "temp" },
        humidity: { label: "Humidity (%)", color: "rgb(59, 130, 246)", yAxis: "humidity" },
        pressure: { label: "Pressure (hPa)", color: "rgb(34, 197, 94)", yAxis: "pressure" },
        precipitation: { label: "Precipitation (mm)", color: "rgb(168, 85, 247)", yAxis: "precip" },
        wind_speed: { label: "Wind Speed (m/s)", color: "rgb(245, 158, 11)", yAxis: "wind" },
        uv_index: { label: "UV Index", color: "rgb(236, 72, 153)", yAxis: "uv" },
        direct_radiation: { label: "Direct Radiation (W/m²)", color: "rgb(139, 92, 246)", yAxis: "rad" },
        soil_temp_0cm: { label: "Soil Temp 0cm (°C)", color: "rgb(245, 158, 11)", yAxis: "soil_temp" },
        soil_temp_6cm: { label: "Soil Temp 6cm (°C)", color: "rgb(249, 115, 22)", yAxis: "soil_temp" },
        soil_temp_18cm: { label: "Soil Temp 18cm (°C)", color: "rgb(251, 146, 60)", yAxis: "soil_temp" },
        soil_moisture_0_1cm: { label: "Soil Moisture 0-1cm (%)", color: "rgb(34, 197, 94)", yAxis: "soil_moist" },
        soil_moisture_1_3cm: { label: "Soil Moisture 1-3cm (%)", color: "rgb(59, 130, 246)", yAxis: "soil_moist" },
        soil_moisture_3_9cm: { label: "Soil Moisture 3-9cm (%)", color: "rgb(99, 102, 241)", yAxis: "soil_moist" },
      };

      let chart = null;

      function drawChart(rows) {
        const labels = rows.map((r) => normalizeTimestamp(r.timestamp));
        const datasets = [];

        Object.entries(dataConfig).forEach(([key, config]) => {
          const checkbox = document.getElementById(`check_${key}`);
          if (!checkbox.checked) return;

          datasets.push({
            label: config.label,
            data: rows.map((r) => toJsNumber(r[key])),
            borderColor: config.color,
            tension: 0.25,
            pointRadius: 0,
            spanGaps: true,
            yAxisID: config.yAxis,
          });
        });

        // Build scales
        const scales = {
          temp: { type: "linear", position: "left", title: { display: true, text: "Temperature (°C)", color: "#e5e7eb" }, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: true, color: "rgba(255,255,255,0.08)" } },
          humidity: { type: "linear", position: "right", title: { display: true, text: "Humidity (%)", color: "#e5e7eb" }, min: 0, max: 100, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          pressure: { type: "linear", position: "right", title: { display: true, text: "Pressure (hPa)", color: "#e5e7eb" }, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          precip: { type: "linear", position: "right", title: { display: true, text: "Precipitation (mm)", color: "#e5e7eb" }, min: 0, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          wind: { type: "linear", position: "right", title: { display: true, text: "Wind Speed (m/s)", color: "#e5e7eb" }, min: 0, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          uv: { type: "linear", position: "right", title: { display: true, text: "UV Index", color: "#e5e7eb" }, min: 0, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          rad: { type: "linear", position: "right", title: { display: true, text: "Radiation (W/m²)", color: "#e5e7eb" }, min: 0, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          soil_temp: { type: "linear", position: "right", title: { display: true, text: "Soil Temp (°C)", color: "#e5e7eb" }, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
          soil_moist: { type: "linear", position: "right", title: { display: true, text: "Soil Moisture (%)", color: "#e5e7eb" }, min: 0, max: 100, ticks: { color: "#9ca3af" }, grid: { drawOnChartArea: false, color: "rgba(255,255,255,0.08)" } },
        };

        const el = document.getElementById("chart");
        if (chart) chart.destroy();
        chart = new Chart(el, {
          type: "line",
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { labels: { color: "#e5e7eb" } },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const v = ctx.parsed.y;
                    if (v === null || Number.isNaN(v)) return `${ctx.dataset.label}: —`;
                    return `${ctx.dataset.label}: ${v.toFixed(2)}`;
                  },
                },
              },
            },
            scales,
          },
        });
      }

      // --- Orchestration ---
      async function reloadAll() {
        try {
          const locationSelect = document.getElementById("locationSelect");
          const limitSelect = document.getElementById("limitSelect");
          const locationName = locationSelect.value;
          const limit = Number(limitSelect.value) || 25;
          if (!locationName) return;
          const rows = await loadAllMeasurements(locationName, limit);
          drawChart(rows);
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Failed to load", true);
        }
      }

      async function init() {
        try {
          const locations = await loadLocations();
          const locationSelect = document.getElementById("locationSelect");
          const limitSelect = document.getElementById("limitSelect");

          // Attach listeners
          locationSelect.addEventListener("change", reloadAll);
          limitSelect.addEventListener("change", reloadAll);
          document.getElementById("refreshBtn").addEventListener("click", reloadAll);

          // Attach checkbox listeners
          Object.keys(dataConfig).forEach((key) => {
            const checkbox = document.getElementById(`check_${key}`);
            if (checkbox) {
              checkbox.addEventListener("change", reloadAll);
            }
          });

          if (locations.length) {
            await reloadAll();
          }

          if (AUTO_REFRESH_MS > 0) {
            setInterval(reloadAll, AUTO_REFRESH_MS);
          }
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Failed to initialize", true);
        }
      }

      init();
    </script>
  </body>
</html>
