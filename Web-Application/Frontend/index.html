<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SPoHF Measurements</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body class="bg-[#020617] text-white font-sans m-0 p-0 h-screen w-screen">
    <div class="flex flex-col h-screen w-screen">
      <div class="flex items-center justify-between px-4 py-2 gap-4">
        <h2 class="font-medium text-xl">SPoHF Measurements over Time</h2>
        <div class="flex items-center gap-2">
          <label for="locationSelect" class="text-sm text-gray-300"
            >Location</label
          >
          <select
            id="locationSelect"
            class="bg-slate-800 text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500"
          >
            <option>Loading…</option>
          </select>

          <button
            id="refreshBtn"
            class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white px-3 py-2 rounded-md"
            title="Reload data now"
          >
            Refresh
          </button>
        </div>
      </div>

      <div class="px-4 -mt-2 text-xs text-slate-400">
        Backend: <span id="backendLabel" class="font-mono"></span>
        <span id="status" class="ml-3"></span>
      </div>

      <div class="flex-1 p-4">
        <canvas id="chart" class="w-full h-full"></canvas>
      </div>
    </div>

    <script>
      // === Configure your backend URL here ===
      const API_BASE = "https://spohf-yolo-v11-production.up.railway.app";

      // Optional: auto-refresh (ms). Set to 0 to disable.
      const AUTO_REFRESH_MS = 60_000; // 60s

      document.getElementById("backendLabel").textContent = API_BASE;

      // --- Helpers ---
      async function getJSON(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`${res.status} ${res.statusText}: ${text || url}`);
        }
        return res.json();
      }

      function toJsNumber(value) {
        if (value === null || value === undefined) return NaN;
        const n = Number(value);
        return Number.isNaN(n) ? NaN : n;
      }

      function setStatus(msg, isError = false) {
        const el = document.getElementById("status");
        el.textContent = msg || "";
        el.className = isError ? "text-red-400" : "text-slate-400";
      }

      // 🔧 FIX: normalize timestamps (prevents [object Object])
      function normalizeTimestamp(ts) {
        if (!ts) return "";

        if (typeof ts === "string") return ts;
        if (ts instanceof Date) return ts.toISOString();

        // Firestore / backend timestamp object
        if (typeof ts === "object" && "seconds" in ts) {
          return new Date(ts.seconds * 1000).toISOString();
        }

        return String(ts);
      }

      // --- Data loading from backend ---
      async function loadLocations() {
        setStatus("Loading locations…");
        const locations = await getJSON(`${API_BASE}/locations`);
        const select = document.getElementById("locationSelect");
        select.innerHTML = "";
        locations.forEach((name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = name;
          select.appendChild(opt);
        });
        setStatus(`Loaded ${locations.length} location(s).`);
        return locations;
      }

      async function loadMeasurements(locationName) {
        setStatus(`Loading measurements for ${locationName}…`);
        const rows = await getJSON(
          `${API_BASE}/measurements?location=${encodeURIComponent(locationName)}`,
        );
        setStatus(`Loaded ${rows.length} points for ${locationName}.`);
        return rows;
      }

      // --- Chart ---
      let chart = null;

      function drawChart(rows) {
        const labels = rows.map((r) => normalizeTimestamp(r.timestamp));

        const data = {
          temperature: rows.map((r) => toJsNumber(r.temperature)),
          humidity: rows.map((r) => toJsNumber(r.humidity)),
          pressure: rows.map((r) => toJsNumber(r.pressure)),
          precipitation: rows.map((r) => toJsNumber(r.precipitation)),
          wind_speed: rows.map((r) => toJsNumber(r.wind_speed)),
        };

        const colors = {
          temperature: "rgb(239, 68, 68)",
          humidity: "rgb(59, 130, 246)",
          pressure: "rgb(34, 197, 94)",
          precipitation: "rgb(168, 85, 247)",
          wind_speed: "rgb(245, 158, 11)",
        };

        const datasets = Object.keys(data).map((key) => ({
          label: key.charAt(0).toUpperCase() + key.slice(1),
          data: data[key],
          borderColor: colors[key],
          tension: 0.25,
          pointRadius: 0,
          spanGaps: true,
          yAxisID: key,
        }));

        const scales = {};
        Object.keys(data).forEach((key) => {
          scales[key] = {
            type: "linear",
            position:
              key === "temperature" || key === "pressure" ? "left" : "right",
            ticks: { color: "#9ca3af" },
            title: {
              display: true,
              text: key.charAt(0).toUpperCase() + key.slice(1),
              color: "#e5e7eb",
            },
            grid: {
              drawOnChartArea: key === "temperature",
              color: "rgba(255,255,255,0.08)",
            },
          };

          if (key === "humidity") {
            scales[key].min = 0;
            scales[key].max = 100;
          } else if (key === "precipitation" || key === "wind_speed") {
            scales[key].min = 0;
          }
        });

        const el = document.getElementById("chart");
        if (chart) chart.destroy();
        chart = new Chart(el, {
          type: "line",
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { labels: { color: "#e5e7eb" } },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const v = ctx.parsed.y;
                    if (v === null || Number.isNaN(v))
                      return `${ctx.dataset.label}: —`;
                    return `${ctx.dataset.label}: ${v}`;
                  },
                },
              },
            },
            scales,
          },
        });
      }

      // --- Orchestration ---
      async function reloadAll() {
        try {
          const select = document.getElementById("locationSelect");
          const locationName = select.value;
          if (!locationName) return;
          const rows = await loadMeasurements(locationName);
          drawChart(rows);
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Failed to load", true);
        }
      }

      async function init() {
        try {
          const locations = await loadLocations();
          const select = document.getElementById("locationSelect");

          select.addEventListener("change", reloadAll);
          document
            .getElementById("refreshBtn")
            .addEventListener("click", reloadAll);

          if (locations.length) {
            await reloadAll();
          }

          if (AUTO_REFRESH_MS > 0) {
            setInterval(reloadAll, AUTO_REFRESH_MS);
          }
        } catch (err) {
          console.error(err);
          setStatus(err.message || "Failed to initialize", true);
        }
      }

      init();
    </script>
  </body>
</html>
